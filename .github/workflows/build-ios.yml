name: Build Bus Traffic Fever IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Detect signing configuration
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${CERT_B64:-}" ]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "Signing enabled."
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "Signing disabled. Building unsigned IPA."
          fi

      - name: Validate Xcode project
        run: |
          set -euo pipefail
          test -f BusTrafficFever.xcodeproj/project.pbxproj
          test -f BusTrafficFever/Info.plist
          xcodebuild \
            -project BusTrafficFever.xcodeproj \
            -list

      - name: Build unsigned archive
        if: env.HAS_SIGNING == 'false'
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          xcodebuild \
            -project BusTrafficFever.xcodeproj \
            -scheme BusTrafficFever \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/BusTrafficFever.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Install Apple signing assets
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :UUID' \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :Name' \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' \
            "$RUNNER_TEMP/profile.plist"
          )

          BUNDLE_ID="${PROFILE_APP_ID#*.}"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Provisioning profile installed."
          echo "Bundle ID: $BUNDLE_ID"

      - name: Build signed archive
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME_SECRET: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          PROFILE_SPECIFIER="${PROFILE_NAME_SECRET:-$PROFILE_NAME}"

          xcodebuild \
            -project BusTrafficFever.xcodeproj \
            -scheme BusTrafficFever \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/BusTrafficFever.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export unsigned IPA
        if: env.HAS_SIGNING == 'false'
        run: |
          set -euo pipefail

          APP_PATH="build/BusTrafficFever.xcarchive/Products/Applications/BusTrafficFever.app"

          test -d "$APP_PATH"

          rm -rf build/Payload build/BusTrafficFever-unsigned.ipa
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/BusTrafficFever.app

          cd build
          zip -qry BusTrafficFever-unsigned.ipa Payload

          echo "Created unsigned IPA:"
          ls -lh BusTrafficFever-unsigned.ipa

      - name: Export signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME_SECRET: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail

          PROFILE_SPECIFIER="${PROFILE_NAME_SECRET:-$PROFILE_NAME}"

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_SPECIFIER}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/BusTrafficFever.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

          cp build/export/BusTrafficFever.ipa build/BusTrafficFever.ipa

          echo "Created signed IPA:"
          ls -lh build/BusTrafficFever.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BusTrafficFever-IPA
          path: build/BusTrafficFever*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: BusTrafficFever-XCArchive
          path: build/BusTrafficFever.xcarchive
          if-no-files-found: error
          retention-days: 7
