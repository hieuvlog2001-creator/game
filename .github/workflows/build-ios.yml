name: Build Bus Traffic Fever IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned archive
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 == '' }}
        run: |
          set -e
          rm -rf build
          mkdir -p build
          xcodebuild \
            -project BusTrafficFever.xcodeproj \
            -scheme BusTrafficFever \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/BusTrafficFever.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Install Apple signing assets
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build signed archive
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: |
          set -e
          rm -rf build
          mkdir -p build
          xcodebuild \
            -project BusTrafficFever.xcodeproj \
            -scheme BusTrafficFever \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/BusTrafficFever.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export unsigned IPA
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 == '' }}
        run: |
          set -e
          rm -rf build/Payload build/BusTrafficFever-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/BusTrafficFever.xcarchive/Products/Applications/BusTrafficFever.app build/Payload/
          cd build
          zip -qry BusTrafficFever-unsigned.ipa Payload

      - name: Export signed IPA
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/BusTrafficFever.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist
          cp build/export/BusTrafficFever.ipa build/BusTrafficFever.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BusTrafficFever-IPA
          path: build/BusTrafficFever*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: BusTrafficFever-XCArchive
          path: build/BusTrafficFever.xcarchive
          retention-days: 7
